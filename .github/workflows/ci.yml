name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'feat/**'
      - 'fix/**'
      - 'ci/**'

  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate EmiBot
    runs-on: ubuntu-latest

    env:
      DISCORD_TOKEN: ci-test-token
      DISCORD_CLIENT_ID: '000000000000000000'
      DISCORD_GUILD_ID: '000000000000000000'
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run validation
        run: npm run check
